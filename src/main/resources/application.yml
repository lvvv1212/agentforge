server:
  port: 8080

spring:
  application:
    name: agentforge

  ai:
    # ===== DeepSeek 对话模型（走 OpenAI 兼容协议）=====
    openai:
      base-url: https://api.deepseek.com/v1
      # 推荐用环境变量注入，避免密钥硬编码：export DEEPSEEK_API_KEY=sk-xxx
      api-key: ${DEEPSEEK_API_KEY:sk-placeholder}
      chat:
        options:
          model: deepseek-chat
          temperature: 0.7

    # ===== 本地向量化（ONNX，零外部服务）=====
    # 默认启用 transformers 向量化（DeepSeek 没有 embedding 接口，故本地化）
    model:
      embedding: transformers
    embedding:
      transformer:
        # 模型与分词器首次运行会从远程下载并缓存到本地（约 80MB）
        cache:
          directory: ${java.io.tmpdir}/spring-ai-onnx-model
        # 国内网络若下载慢，可改用 HuggingFace 国内镜像（取消注释并调整）：
        # onnx:
        #   model-uri: https://hugging-face.cn/sentence-transformers/all-MiniLM-L6-v2/resolve/main/onnx/model.onnx
        # tokenizer:
        #   uri: https://hugging-face.cn/sentence-transformers/all-MiniLM-L6-v2/resolve/main/onnx/tokenizer.json

    # ===== 持久化向量库（仅 redis profile 生效）=====
    # Redis 需带向量检索能力：redis-stack-server 或 Redis 8+（普通 redis 无 FT.CREATE 会启动失败）
    vectorstore:
      redis:
        index-name: agentforge-index
        prefix: agentforge:

  # ===== Redis 连接（仅 redis profile 使用；默认 localhost，容器内由 compose 注入 REDIS_HOST）=====
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: 6379

logging:
  level:
    org.springframework.ai.chat.client.advisor: DEBUG
